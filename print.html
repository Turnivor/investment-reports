<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Officium Advocati Diaboli</title>
<link rel="icon" type="image/png" href="brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* The paper version of a report: print.html#<report id>. tools/make_pdf.py prints this page to the PDF that sits
   next to each report. Page 1 is the working sheet (verdict, value range, the report's plan, dates to tick off);
   the full report follows. Light on purpose: it is meant for paper. */
:root {
  --ink: #1c1d20; --muted: #5f6168; --rule: #d8d4c8; --paper: #fff; --tint: #f6f3ea;
  --gold: #8f7130; --bad: #a8382c; --warn: #9a5a12; --good: #2f7148;
  --f-title: "Cinzel", "Times New Roman", serif;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Newsreader", Georgia, "Times New Roman", serif;
  --f-mono: "IBM Plex Mono", Consolas, monospace;
}
@page { size: A4; margin: 15mm 15mm 16mm; }
* { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
html { background: #e9e6dd; }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: 10.5pt; line-height: 1.5; }
.doc { background: var(--paper); max-width: 180mm; margin: 24px auto; padding: 15mm; box-shadow: 0 10px 40px rgba(0, 0, 0, .18); }
.tools { max-width: 180mm; margin: 24px auto 0; display: flex; gap: 12px; align-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.tools button, .tools a { font: inherit; color: var(--ink); background: #fff; border: 1px solid #bdb8a8; border-radius: 3px; padding: 7px 12px; cursor: pointer; text-decoration: none; }
@media print {
  html { background: none; }
  .doc { max-width: none; margin: 0; padding: 0; box-shadow: none; }
  .tools { display: none; }
}
a { color: var(--gold); }
h1, h2, h3, h4 { break-after: avoid; }

/* ---------- letterhead ---------- */
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 6pt; border-bottom: 1.2pt solid var(--gold); }
.head b { font-family: var(--f-title); font-weight: 500; font-size: 11pt; letter-spacing: .14em; text-transform: uppercase; }
.head i { font-size: 10pt; color: var(--gold); }
.note { font-family: var(--f-mono); font-size: 7.6pt; color: var(--muted); margin: 5pt 0 0; }

/* ---------- the sheet ---------- */
.eyebrow { font-family: var(--f-mono); font-size: 8pt; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 16pt; }
.sheet h1 { font-family: var(--f-body); font-weight: 500; font-size: 30pt; line-height: 1.05; letter-spacing: -.01em; margin: 2pt 0 8pt; }
.meta { display: flex; flex-wrap: wrap; gap: 6pt 14pt; align-items: center; font-family: var(--f-mono); font-size: 8.6pt; color: var(--muted); }
.stamp { font-family: var(--f-mono); font-weight: 500; font-size: 8.2pt; letter-spacing: .08em; text-transform: uppercase; padding: 3.5pt 8pt; border: 1pt solid currentColor; outline: .5pt solid currentColor; outline-offset: -3pt; }
.stamp.bad { color: var(--bad); } .stamp.warn { color: var(--warn); } .stamp.good { color: var(--good); }
.lead { font-size: 17pt; font-weight: 500; line-height: 1.2; margin: 14pt 0 10pt; text-wrap: balance; }
.label { font-family: var(--f-mono); font-weight: 500; font-size: 7.6pt; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 0 0 4pt; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12pt 22pt; margin-top: 12pt; }
.cols > div, .block { break-inside: avoid; }
.block { margin-top: 13pt; }
.block.dates { break-inside: auto; }
.sheet ul { margin: 0; padding-left: 1.1em; }
.sheet li { margin-bottom: 2.5pt; }
.sheet p { margin: 0 0 4pt; }
ul.tick { list-style: none; padding-left: 0; }
ul.tick li { padding-left: 15pt; position: relative; }
ul.tick li::before { content: ""; position: absolute; left: 0; top: 3.2pt; width: 7.5pt; height: 7.5pt; border: .8pt solid var(--ink); }
table { border-collapse: collapse; width: 100%; font-family: var(--f-display); font-size: 9.2pt; line-height: 1.35; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: 7.8pt; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); border-bottom: .9pt solid var(--gold); }
th, td { padding: 3.6pt 6pt; vertical-align: top; border-bottom: .5pt solid var(--rule); }
thead { display: table-header-group; }
tr { break-inside: avoid; }
.sheet td.num { text-align: right; white-space: nowrap; }
.up { color: var(--good); } .down { color: var(--bad); }
.small { font-family: var(--f-mono); font-size: 7.6pt; line-height: 1.5; color: var(--muted); }
.box { background: var(--tint); border-left: 2pt solid var(--gold); padding: 7pt 10pt; }
td.sq { width: 14pt; } td.sq::before { content: ""; display: block; width: 7.5pt; height: 7.5pt; margin-top: 2pt; border: .8pt solid var(--ink); }
td.when { white-space: nowrap; font-family: var(--f-mono); font-size: 8.4pt; }

/* ---------- the full report ---------- */
.full { margin-top: 22pt; }
.full > .label { margin-bottom: 8pt; padding-bottom: 5pt; border-bottom: 1.2pt solid var(--gold); }
.prose h2 { font-family: var(--f-body); font-weight: 500; font-size: 16pt; line-height: 1.2; margin: 18pt 0 6pt; padding-top: 7pt; border-top: .6pt solid var(--rule); }
.prose h3 { font-family: var(--f-display); font-weight: 600; font-size: 11.5pt; margin: 12pt 0 4pt; }
.prose h4 { font-family: var(--f-display); font-weight: 600; font-size: 10.5pt; margin: 10pt 0 3pt; }
.prose p, .prose ul, .prose ol { margin: 0 0 7pt; }
.prose li { margin-bottom: 2pt; }
.prose blockquote { margin: 8pt 0; padding: 6pt 10pt; background: var(--tint); border-left: 2pt solid var(--gold); break-inside: avoid; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose code { font-family: var(--f-mono); font-size: .84em; background: #f0ede4; padding: 0 3pt; border-radius: 2pt; }
.prose pre { background: #f0ede4; padding: 7pt 9pt; font-size: 8pt; white-space: pre-wrap; break-inside: avoid; }
.prose pre code { background: none; padding: 0; }
.prose img { max-width: 100%; height: auto; border: .5pt solid var(--rule); }
.prose table { margin: 6pt 0 10pt; }
.prose hr { border: 0; border-top: .6pt solid var(--rule); margin: 12pt 0; }
.prose a { overflow-wrap: anywhere; }
.end { margin-top: 16pt; padding-top: 6pt; border-top: 1.2pt solid var(--gold); }
.index a { display: block; padding: 4pt 0; }
</style>
</head>
<body>
<div class="tools" id="tools" hidden><button type="button" onclick="print()">Print or save as PDF</button><a id="back" href="./">Open on the site</a><span>The paper version of this report.</span></div>
<main class="doc" id="doc">Loading…</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="reports.js"></script>
<script>
const SITE = "https://turnivor.github.io/investment-reports/";
const STALE_DAYS = 90;
const { reports: REPORTS, links: LINK_MAP, fx: FX, currencies: CUR_CODE } = window.SITE_DATA;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
const money = (cur, v) => cur + v.toLocaleString("en-GB", { maximumFractionDigits: v < 100 ? 2 : 0 });
const exact = (cur, v) => cur + v.toLocaleString("en-GB", Number.isInteger(v) ? {} : { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const plusDays = (day, n) => { const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const list = (xs, cls) => `<ul${cls ? ` class="${cls}"` : ""}>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;

function valueRange(r) {
  const b = r.bands; if (!b) return "";
  const row = (name, gloss, v) => { const d = (v / b.price - 1) * 100;
    return `<tr><td><b>${name}</b> ${gloss}</td><td class="num">${money(b.cur, v)}</td><td class="num ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(0)}%</td></tr>`; };
  const code = CUR_CODE[b.cur], day = Object.keys(FX).sort().reverse().find(d => d <= r.date);
  let lei = "";
  if (code && day && FX[day][code]) {
    const ron = b.price * FX[day][code], eur = ron / FX[day].EUR;
    lei = `<p class="small">${exact(b.cur, b.price)} ≈ ${code === "EUR" ? "" : "€" + eur.toFixed(2) + " ≈ "}${ron.toLocaleString("en-GB", { maximumFractionDigits: ron < 100 ? 1 : 0 })} lei a share, at National Bank of Romania rates of ${fmtDate(day)}.</p>`;
  }
  return `<div><p class="label">What the shares could be worth</p>
    <table><thead><tr><th>Case</th><th style="text-align:right">Value</th><th style="text-align:right">vs ${exact(b.cur, b.price)}</th></tr></thead><tbody>
    ${row("Bear", "if it goes badly", b.bear)}${row("Base", "as expected", b.base)}${row("Bull", "if it goes well", b.bull)}</tbody></table>
    ${b.zoneLabel ? `<p style="margin-top:5pt"><b>${esc(b.zoneLabel)}.</b></p>` : ""}${b.note ? `<p class="small">${esc(b.note)}</p>` : ""}${lei}</div>`;
}

function sheet(r) {
  const p = r.plan, refresh = plusDays(r.date, STALE_DAYS + 1);
  const dates = (r.calendar && r.calendar.length ? r.calendar : r.next && r.next.until ? [{ date: r.next.until, what: "Checkpoint", check: r.next.text }] : [])
    .concat([{ date: refresh, what: "Refresh the verdict", check: `It turns ${STALE_DAYS} days old; rerun the research before relying on it.` }]).sort((a, b) => a.date.localeCompare(b.date));
  const ups = [...(r.updates || [])].sort((a, b) => b.date.localeCompare(a.date));
  return `
  <header class="head"><b>Officium Advocati Diaboli</b><i lang="la">Fortuna vitrea est</i></header>
  <p class="note">Personal research made with AI help. Not investment advice. Verify before acting. Online: ${SITE}#${esc(r.id)}</p>
  <section class="sheet">
    <div class="eyebrow">${esc(r.kind)} · ${esc(r.venue)} · ${esc(r.ticker)}</div>
    <h1>${esc(r.title)}</h1>
    <div class="meta"><span>Report of ${fmtDate(r.date)}</span><span>Price at research ${esc(r.px)}</span><span class="stamp ${r.tone}">${esc(r.verdict)}</span></div>
    <p class="lead">${esc(r.headline)}</p>
    <div class="cols">
      <div><p class="label">Why</p>${list(r.reasons)}</div>
      ${valueRange(r) || `<div><p class="label">Signals to watch</p>${list(r.watch, "tick")}</div>`}
    </div>
    ${r.bands && !p ? `<div class="block"><p class="label">Signals to watch</p>${list(r.watch, "tick")}</div>` : ""}
    ${r.next ? `<div class="block box"><p class="label">Next checkpoint</p><p style="margin:0">${esc(r.next.text)}</p></div>` : ""}
    ${p ? `<div class="cols">
      ${p.none ? `<div><p class="label">If you don't own it</p><p>${esc(p.none)}</p></div>` : ""}
      ${p.holding ? `<div><p class="label">If you own it</p><p>${esc(p.holding)}</p></div>` : ""}
      ${p.add ? `<div><p class="label">Signals to add</p>${list(p.add, "tick")}</div>` : ""}
      ${p.sell ? `<div><p class="label">Signals to sell</p>${list(p.sell, "tick")}</div>` : ""}
    </div>` : ""}
    <div class="block dates"><p class="label">Dates to tick off</p>
      <table><thead><tr><th></th><th>When</th><th>What</th><th>What to check</th></tr></thead><tbody>
      ${dates.map(c => `<tr><td class="sq"></td><td class="when">${c.approx ? "≈ " : ""}${fmtDate(c.date)}</td><td><b>${esc(c.what)}</b>${c.approx ? `<br><span class="small">Date not confirmed: ${esc(c.approx)}</span>` : ""}</td><td>${esc(c.check || "")}</td></tr>`).join("")}
      </tbody></table>
    </div>
    ${ups.length ? `<div class="block"><p class="label">Since the report</p><table><tbody>${ups.map(u => `<tr><td class="when">${fmtDate(u.date)}</td><td><b>${esc(u.title)}</b><br>${esc(u.text)}${u.was ? `<br><span class="small">Verdict before this update: ${esc(u.was)}</span>` : ""}</td></tr>`).join("")}</tbody></table></div>` : ""}
  </section>`;
}

function prose(md) {
  const box = document.createElement("div");
  box.innerHTML = DOMPurify.sanitize(marked.parse(md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, ""), { gfm: true }));
  const h1 = box.querySelector("h1"); if (h1) h1.remove();
  box.querySelectorAll("img[src]").forEach(img => { const s = img.getAttribute("src"), i = s.indexOf("charts/"); if (i >= 0) img.setAttribute("src", s.slice(i)); });
  // links to other reports point at the site; any other relative link becomes plain text
  box.querySelectorAll("a[href]").forEach(a => {
    const href = a.getAttribute("href"); if (/^https?:/i.test(href)) return;
    const hit = LINK_MAP.find(([needle]) => href.includes(needle));
    if (hit) a.setAttribute("href", SITE + "#" + hit[1]); else a.replaceWith(document.createTextNode(a.textContent));
  });
  return box.innerHTML;
}

async function draw() {
  const id = location.hash.slice(1), r = REPORTS.find(x => x.id === id), doc = document.getElementById("doc");
  document.getElementById("tools").hidden = false;
  if (!r) {
    doc.innerHTML = `<header class="head"><b>Officium Advocati Diaboli</b><i>Paper versions</i></header><div class="index block">${REPORTS.map(x => `<a href="#${x.id}">${esc(x.title)} · ${fmtDate(x.date)}</a>`).join("")}</div>`;
    return;
  }
  document.title = `${r.title} · ${r.date} · Officium Advocati Diaboli`;
  document.getElementById("back").href = "./#" + r.id;
  let body;
  try { const res = await fetch(r.file); if (!res.ok) throw new Error(res.status); body = prose(await res.text()); }
  catch (e) { body = "<p>The report text could not be loaded.</p>"; }
  doc.innerHTML = sheet(r) + `<section class="full"><p class="label">The full report · ${esc(r.title)} · ${fmtDate(r.date)}</p><article class="prose">${body}</article>
    <p class="note end">Personal research made with AI help. Not investment advice. Verify before acting. ${SITE}#${esc(r.id)}</p></section>`;
  await Promise.all([...document.images].map(img => img.complete ? 0 : new Promise(done => { img.onload = img.onerror = done; })));
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  document.documentElement.dataset.ready = "1";
}
window.addEventListener("hashchange", draw);
draw();
</script>
</body>
</html>
