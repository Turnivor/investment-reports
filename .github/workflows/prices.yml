# Saves the latest prices to prices.json each weekday at 16:00 UTC (New York is still trading then, so US prices are mid-session).
# Can also be started by hand from the Actions tab ("Run workflow").
name: Update prices

on:
  schedule:
    - cron: "0 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch prices
        run: python3 tools/fetch_prices.py
      - name: Commit if a price changed
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "Update prices"
            git push
          fi
