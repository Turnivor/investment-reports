# Publishes the site to Cloudflare Pages, where it sits behind the friends-only sign-in (see FRIENDS-SETUP.md).
# Runs on every push to main and after each daily price update (the price job's own commit does not start other jobs).
# Until the two Cloudflare secrets exist it does nothing and passes, so it is safe to have before Cloudflare is set up.
# Can also be started by hand from the Actions tab ("Run workflow").
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update prices"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: officium-advocati-diaboli   # the Cloudflare Pages project name

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare is not set up yet (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets missing), so nothing was published."
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # after a price update, take main as it is now, with the new prices.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy . --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
